<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 取消列表前的点 */
      /* li {
        list-style: none;
      } */
      li:first-child {
        color: red;
      }
      li:nth-child(2n) {
        color: green;
      }
      li::after {
        content: "这是第" attr(data-index) "个";
      }
      div {
        width: 100px;
        height: 200px;
        padding: 10px;
        background: #18bc77;
        border: 3px dotted #8a1313;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <!-- 空格 -->
    &nbsp;
    <div>cnm</div>

    <ul>
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
      <li>5</li>
      <li>6</li>
      <li>7</li>
      <li>8</li>
    </ul>
  </body>
</html>
